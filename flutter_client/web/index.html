    #flutter-loading {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;

      transition: opacity 0.3s ease;
    }

      pointer-events: none;
    }
    #flutter-loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: flutter-load-spin 0.9s linear infinite;
    }
    #flutter-loading .text {
      margin-top: 20px;
      font-size: 15px;
      color: #b0b0b0;
    }
    @keyframes flutter-load-spin {
      to { transform: rotate(360deg); }

  <script>
    (function() {
      var loading = document.getElementById('flutter-loading');
      var done = false;
      function hideLoading() {
        if (done) return;
        done = true;
        if (!loading) return;
        loading.classList.add('hidden');
        setTimeout(function() {
          if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
        }, 350);
      }
      window.addEventListener('flutter-first-frame', hideLoading);
      var fallback = setInterval(function() {
        if (document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
          clearInterval(fallback);
          hideLoading();
        }
      }, 100);
      setTimeout(function() { clearInterval(fallback); fallback = null; }, 60000);
      setTimeout(hideLoading, 60000);
    })();

        const url = typeof input === 'string' ? input : (input && input.url) ? input.url : '';

            const vfId = 'vf_' + (vfSeq++);
            videoFetchControllers.set(vfId, ctrl);

              __p2p: 'fetch',

  <script type="application/javascript">
    (function () {
      function getSs() {
        try {
          const ss = window.streamSaver;
          if (!ss || typeof ss !== 'object') return null;
          if (typeof ss.createWriteStream !== 'function') return null;
          if (typeof ss.WritableStream !== 'function') return null;
          try {
            ss.mitm = './assets/vendor/streamsaver/mitm.html';
          } catch (_) {}
          return ss;
        } catch (_) {
          return null;
        }
      }

      window.__nascabStreamSaverInit = function () {
        return !!getSs();
      };

      window.__nascabStreamSaverCreateWriter = function (filename, size, mimeType) {
        const ss = getSs();
        if (!ss) throw new Error('streamsaver_not_ready');
        const name = String(filename || '').trim() || 'download';
        const opts = {};
        const n = Number(size);
        if (Number.isFinite(n) && n > 0) opts.size = n;
        if (mimeType && typeof mimeType === 'string' && mimeType.trim()) {
          try {
            opts.headers = { 'Content-Type': mimeType.trim() };
          } catch (_) {}
        }
        const ws = ss.createWriteStream(name, opts);
        if (!ws || typeof ws.getWriter !== 'function') throw new Error('streamsaver_no_writer');
        return ws.getWriter();
      };

      window.__nascabStreamSaverWrite = function (writer, buffer) {
        return writer.write(new Uint8Array(buffer));
      };

      window.__nascabStreamSaverClose = function (writer) {
        return writer.close();
      };

      window.__nascabStreamSaverAbort = function (writer) {
        if (!writer) return;
        if (typeof writer.abort === 'function') return writer.abort();
      };

      window.__nascabHasShowSaveFilePicker = function () {
        try {
          return typeof window.showSaveFilePicker === 'function';
        } catch (_) {
          return false;
        }
      };

      window.__nascabShowSaveFilePicker = function (suggestedName) {
        const name = String(suggestedName || '').trim() || 'download';
        if (typeof window.showSaveFilePicker !== 'function') {
          return Promise.reject(new Error('showSaveFilePicker_not_supported'));
        }
        return window.showSaveFilePicker({ suggestedName: name });
      };
    })();
