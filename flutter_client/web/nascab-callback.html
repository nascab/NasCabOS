<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NasCab CallBack</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #eaeaea;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .box {
      text-align: center;
      padding: 32px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div>正在完成登录...</div>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = (params.get('code') || '').trim();
      var jwt  = (params.get('jwt')  || '').trim();

      if (code || jwt) {
        var payload = { type: 'nascab_auth' };
        if (code) payload.code = code;
        if (jwt)  payload.jwt  = jwt;

        if (window.opener) {
          try {
            window.opener.postMessage(JSON.stringify(payload), window.location.origin);
            console.log('[DEBUG-OAUTH] nascab-callback.html: postMessage 已发送', payload);
          } catch (e) {
            console.error('[DEBUG-OAUTH] nascab-callback.html: postMessage 失败', e);
          }
        } else {
          console.warn('[DEBUG-OAUTH] nascab-callback.html: opener 为 null，无法发送 postMessage');
        }
      } else {
        console.warn('[DEBUG-OAUTH] nascab-callback.html: URL 中没有 code/jwt');
      }

      setTimeout(function() {
        try { window.close(); } catch (_) {}
      }, 300);
    })();
  </script>
</body>
</html>
